name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test and run evals (mock provider)
        run: ./mvnw -B verify
      - name: Publish eval report to the job summary
        if: always()
        run: cat target/eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
