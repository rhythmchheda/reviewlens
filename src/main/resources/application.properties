spring.application.name=reviewlens
# 8080 is taken on the dev machine; override with the PORT env var
server.port=${PORT:8081}

# ---- LLM provider: mock | openai | ollama ----
reviewlens.llm.provider=${LLM_PROVIDER:mock}
reviewlens.llm.openai.api-key=${OPENAI_API_KEY:}
reviewlens.llm.openai.model=${OPENAI_MODEL:gpt-4o-mini}
reviewlens.llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
reviewlens.llm.ollama.model=${OLLAMA_MODEL:llama3.2}
reviewlens.llm.mock.hallucinate=true

# Read timeout per LLM HTTP call, and max concurrent LLM calls across all requests
reviewlens.llm.timeout-seconds=30
reviewlens.llm.max-concurrency=4

# Retry (exponential backoff + jitter) and circuit breaker around every LLM call
reviewlens.llm.retry.max-attempts=3
reviewlens.llm.retry.initial-backoff-ms=200
reviewlens.llm.circuit.failure-threshold=5
reviewlens.llm.circuit.open-seconds=30

# USD per 1M tokens, used for cost reporting. Set to your provider's current prices.
reviewlens.llm.price.input-per-million=${LLM_PRICE_INPUT:0}
reviewlens.llm.price.output-per-million=${LLM_PRICE_OUTPUT:0}

# ---- Prompt budget (estimated tokens, ~4 chars/token) ----
reviewlens.prompt.max-input-tokens=3000
reviewlens.prompt.max-review-chars=1000
reviewlens.prompt.max-reviews-per-chunk=10

# ---- Observability: /actuator/health, /actuator/metrics/reviewlens.* ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
