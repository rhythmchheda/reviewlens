spring.application.name=reviewlens
# 8080 is taken on this machine; override with PORT env var
server.port=${PORT:8081}

# mock | openai | ollama
reviewlens.llm.provider=${LLM_PROVIDER:mock}
reviewlens.llm.openai.api-key=${OPENAI_API_KEY:}
reviewlens.llm.openai.model=${OPENAI_MODEL:gpt-4o-mini}
reviewlens.llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
reviewlens.llm.ollama.model=${OLLAMA_MODEL:llama3.2}

# Prompt budget (estimated tokens, ~4 chars/token)
reviewlens.prompt.max-input-tokens=3000
reviewlens.prompt.max-review-chars=1000
